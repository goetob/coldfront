name: Update maps

# Twice an hour, shortly after the stations' 10-minute values arrive:
# fetch what is new, render the rolling window and deploy the site.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "web/**", "data/events/**", "requirements*.txt", ".github/workflows/update.yml"]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  WINDOW_HOURS: "72"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The raw window and the maps of hours that can no longer change are
      # carried from run to run. Losing them only makes the next run slower;
      # a change to the pipeline starts afresh so no map keeps an old style.
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            web/public/maps/now
            web/src/data/now.json
          key: window-${{ hashFiles('scripts/**/*.py') }}-${{ github.run_id }}
          restore-keys: window-${{ hashFiles('scripts/**/*.py') }}-

      # Archived days never change; their maps are drawn once.
      - uses: actions/cache@v4
        with:
          path: web/public/archive
          key: archive-${{ hashFiles('scripts/render_maps.py', 'scripts/build_archive.py', 'scripts/fields.py') }}-${{ github.run_id }}
          restore-keys: archive-${{ hashFiles('scripts/render_maps.py', 'scripts/build_archive.py', 'scripts/fields.py') }}-

      # Event maps only change with their data or the renderer.
      - id: event-cache
        uses: actions/cache@v4
        with:
          path: |
            web/public/maps/*
            !web/public/maps/now
            web/src/data/events
          key: events-${{ hashFiles('data/events/**', 'scripts/render_maps.py', 'scripts/fields.py', 'data/geo/**') }}

      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          cd web && npm ci

      - name: Test
        run: python -m pytest -q tests

      - name: Fetch
        run: python scripts/fetch.py --hours $((WINDOW_HOURS + 32)) --keep $((WINDOW_HOURS + 40))

      - name: Render rolling window
        run: |
          # A day more than shown: the 24-hour changes and sums need it.
          python scripts/build_hourly.py --hours $((WINDOW_HOURS + 24))
          python scripts/render_maps.py --hours "$WINDOW_HOURS" --fresh 3 --prune

      - name: Render events
        if: steps.event-cache.outputs.cache-hit != 'true'
        run: |
          for dir in data/events/*/; do
            slug=$(basename "$dir")
            start=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['start'])" "$dir/event.json")
            python scripts/render_maps.py --hourly "$dir/hourly.json" --start "$start" \
              --out "web/public/maps/$slug" --meta "web/src/data/events/$slug.json"
          done

      - name: Archive, stations and events
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add archive FETCH_HEAD
            python scripts/build_archive.py
          else
            echo "No data branch yet, skipping the archive pages"
          fi
          python scripts/detect_events.py

      - name: Build site
        working-directory: web
        run: npx astro build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # One open issue while scheduled runs fail; closed again by the next success.
  report:
    needs: [build, deploy]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          FAILED: ${{ needs.build.result == 'failure' || needs.deploy.result == 'failure' }}
        with:
          script: |
            const title = "Kartenaktualisierung schlägt fehl";
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", creator: "github-actions[bot]", per_page: 100,
            });
            const issue = open.find((i) => i.title === title);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (process.env.FAILED === "true") {
              if (issue) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Wieder fehlgeschlagen: ${run}` });
              } else {
                await github.rest.issues.create({ ...context.repo, title, body: `Der geplante Lauf ist fehlgeschlagen: ${run}` });
              }
            } else if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Läuft wieder: ${run}` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed", state_reason: "completed" });
            }
