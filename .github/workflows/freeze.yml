name: Archive day

# Once a day: archive the previous local day as Parquet on the data branch,
# fold the day files of months that are over into month files, and rebuild
# the normals and the events over the whole archive.
#
# With "recheck" it applies the hourly gust, snow depth and temperature
# checks (meteo/qc.py) to the whole archive, for days archived before them.
# Every day it applies them to the day files of the current month together,
# since the temperature checks need more than the one day just fetched.
#
# With "from" it backfills instead: month by month, newest first, one month
# file each, pushing every few months so an aborted job loses little. It
# stops starting months after "budget" minutes; with "chain" it then starts
# itself again with the same inputs, and months already archived are skipped.
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Local day YYYY-MM-DD (default yesterday)
        required: false
      from:
        description: Backfill months from this local day (YYYY-MM-DD) to "to" or yesterday
        required: false
      to:
        description: Last day of the backfill
        required: false
      force:
        description: Overwrite an archived day
        type: boolean
        default: false
      budget:
        description: Minutes of fetching per job when backfilling
        default: "270"
      chain:
        description: Start the next backfill job until all months are there
        type: boolean
        default: false
      recheck:
        description: Apply the hourly gust, snow depth and temperature checks to the whole archive
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: freeze

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The event detection needs the terrain model to tell summits from valleys.
      - run: pip install -r requirements.txt

      - name: Check out data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add -B data archive FETCH_HEAD
          else
            git worktree add --orphan -b data archive
          fi
          cd archive
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

      - name: Archive
        if: ${{ !inputs.from }}
        env:
          DAY: ${{ inputs.date }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          python scripts/freeze_day.py --out archive ${DAY:+--date "$DAY"} $FORCE ${DAY:---compact}

      - name: Backfill
        id: backfill
        if: ${{ inputs.from }}
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          BUDGET: ${{ inputs.budget }}
        run: |
          push() {
            git -C archive add -A
            git -C archive diff --cached --quiet && return 0
            git -C archive commit -q -m "backfill: $1"
            git -C archive push -q origin HEAD:data
          }
          months=$(python scripts/freeze_day.py --out archive --todo --from "$FROM" ${TO:+--to "$TO"})
          echo "$(echo "$months" | grep -c . || true) months to fetch"
          done_=""; left=0; fetched=0
          for m in $months; do
            if [ "$SECONDS" -gt $(( ${BUDGET:-270} * 60 )) ]; then left=$((left + 1)); continue; fi
            if python scripts/freeze_day.py --out archive --month "$m" ${TO:+--to "$TO"}; then
              done_="$done_ $m"; fetched=$((fetched + 1))
            else
              echo "::warning::$m failed"; left=$((left + 1))
            fi
            # Every six months, about 12 minutes of fetching.
            if [ $(echo $done_ | wc -w) -ge 6 ]; then push "$(echo $done_ | tr ' ' '\n' | tail -1) to $(echo $done_ | cut -d' ' -f1)"; done_=""; fi
          done
          [ -n "$done_" ] && push "$(echo $done_ | tr ' ' '\n' | tail -1) to $(echo $done_ | cut -d' ' -f1)"
          echo "$fetched months fetched, $left left"
          # A job that got nowhere does not start another one.
          [ "$fetched" -gt 0 ] && [ "$left" -gt 0 ] && echo "more=true" >> "$GITHUB_OUTPUT"
          true

      - name: Recheck gusts, snow depth and temperature
        if: ${{ !inputs.from }}
        env:
          ONLY_DAYS: ${{ !inputs.recheck && '--day-files' || '' }}
        run: python scripts/recheck.py --archive archive $ONLY_DAYS

      - name: Normals and events
        run: |
          python scripts/build_normals.py --archive archive
          python scripts/detect_events.py --archive archive --history archive/events.json

      - name: Commit
        working-directory: archive
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          days=$(git diff --cached --name-only | grep -o '[0-9]\{4\}-[0-9]\{2\}\(-[0-9]\{2\}\)\?' | sort -u)
          n=$(echo "$days" | grep -c . || true)
          if [ "$n" -gt 3 ]; then msg="$(echo "$days" | head -1) to $(echo "$days" | tail -1) ($n files)"; else msg=$(echo $days); fi
          git commit -m "archive: ${msg:-normals, events, stations}"
          git push origin HEAD:data

      - name: Next backfill job
        if: ${{ inputs.from && inputs.chain && steps.backfill.outputs.more == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          BUDGET: ${{ inputs.budget }}
        run: |
          gh workflow run freeze.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f from="$FROM" ${TO:+-f to="$TO"} -f budget="$BUDGET" -f chain=true
