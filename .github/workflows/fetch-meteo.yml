name: Fetch meteo data

# Manual only: the hourly schedule ran while the 20-22 October cold front
# passed. Re-add a schedule to follow the next event.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: Hours of history to fetch
        default: "6"

permissions:
  contents: write

concurrency:
  group: fetch-meteo

env:
  DATA_BRANCH: claude/meteo-data

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        run: python scripts/fetch_meteo.py --hours "${{ inputs.hours || '6' }}"
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet && exit 0
          git commit -m "data: meteo update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin "HEAD:$DATA_BRANCH"
